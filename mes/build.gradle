plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smartfactory'
version = '0.1.0'

// JDK 17 이상이면 어느 것으로 돌려도 17 바이트코드로 (toolchain 을 쓰면 PC 에 JDK 17 이 따로 없을 때 빌드가 멈춘다)
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'      // 윈도우 기본(MS949) 으로 읽으면 한글 주석에서 컴파일이 깨진다
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // MQTT 클라이언트 — 설비(검사대)와는 MQTT, 사람(화면·관리)과는 REST
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
